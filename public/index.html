<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EvoGuard IDS Dashboard</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="header">
    <div>
      <h1>EvoGuard IDS Dashboard</h1>
      <p>Basic Web Intrusion Detection System</p>
    </div>

    <button id="refreshButton">Refresh Logs</button>
  </header>

  <main class="container">
    <section class="summary-grid">
      <article class="summary-card">
        <h2>Total Attacks</h2>
        <p id="totalAttacks">0</p>
      </article>

      <article class="summary-card">
        <h2>SQL Injection</h2>
        <p id="sqlCount">0</p>
      </article>

      <article class="summary-card">
        <h2>XSS</h2>
        <p id="xssCount">0</p>
      </article>

      <article class="summary-card">
        <h2>Path Traversal</h2>
        <p id="pathCount">0</p>
      </article>
    </section>

    <section class="table-section">
      <div class="section-heading">
        <h2>Recent Attack Logs</h2>
        <p id="statusMessage">Loading attack logs...</p>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>IP Address</th>
              <th>Method</th>
              <th>Endpoint</th>
              <th>Attack Type</th>
              <th>Risk Score</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="logsTableBody">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
